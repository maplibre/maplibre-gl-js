<!DOCTYPE html>
<html lang="en">
<head>
    <title>MapLibre GL JS Benchmarks</title>

    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="about:blank">
</head>

<body>
    <div id="benchmarks"></div>
    <script type="module">
        import * as Benchmarks from '/test/bench/benchmarks_view_generated.mjs';
        window.Benchmarks = Benchmarks;
        runBenchmarks();

        async function runBenchmarks() {
            try {
                await import('/test/bench/versions/benchmarks_generated.mjs');

                const benchmarks = [];
                for (const benchmarkName of Object.keys(window.maplibreglBenchmarks).sort()) {
                    const versions = Object.keys(window.maplibreglBenchmarks[benchmarkName]).map(version => ({
                        displayName: version,
                        name: version,
                        bench: window.maplibreglBenchmarks[benchmarkName][version]
                    }));
                    benchmarks.push({name: benchmarkName, versions});
                }

                const results = await window.Benchmarks.run(benchmarks);

                window.maplibreglBenchmarkResults = {};
                for (const result of results) {
                    window.maplibreglBenchmarkResults[result.name] = {};
                    for (const version of result.versions) {
                        window.maplibreglBenchmarkResults[result.name][version.name] = {name: version.name, summary: version.summary, regression: version.regression};
                    }
                }

                window.maplibreglBenchmarkFinished = true;
            } catch (ex) {
                console.error(ex);
                // Surface the failure to the headless runner, which otherwise
                // waits for maplibreglBenchmarkFinished forever.
                window.maplibreglBenchmarkError = ex instanceof Error ? ex.message : String(ex);
            }
        }
    </script>
</body>

</html>
