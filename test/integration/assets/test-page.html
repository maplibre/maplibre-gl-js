<!DOCTYPE html>
<html lang="en">
<head>
    <title>MapLibre integration test page</title>
    <meta charset='utf-8'>
    <link rel='stylesheet' href='/dist/maplibre-gl.css' />
    <style>
        /* Noto Sans Arabic SemiCondensed SemiBold draws the Arabic letters of the `Arial Unicode MS Bold` fallback in the font stacks the render tests use. */
        @font-face {
            font-family: 'Arial Unicode MS Bold';
            font-weight: 100 900;
            src: url('/font/NotoSansArabic-SemiCondensedSemiBold.ttf') format('truetype');
            unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200D;
        }
        /* Noto Sans Devanagari draws the Devanagari letters of the `is-supported-script` tests. */
        @font-face {
            font-family: 'Noto Sans Devanagari';
            font-weight: 100 900;
            src: url('/fonts/noto-sans-devanagari/files/noto-sans-devanagari-devanagari-400-normal.woff2') format('woff2');
            unicode-range: U+0900-097F, U+1CD0-1CFF, U+A8E0-A8FF;
        }
        body { margin: 0; padding: 0; }
        #map { 
            box-sizing:content-box;
            width:100vw;
            height:100vh; 
        }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
    import * as maplibregl from '/dist/maplibre-gl-dev.mjs';
    maplibregl.setWorkerUrl('/dist/maplibre-gl-worker-dev.mjs');
    // Spawn the worker pool now and keep it alive across Map.remove() calls
    // so each test reuses the warm worker instead of paying module-worker
    // startup cost on every Map.
    maplibregl.prewarm();
    await document.fonts.load('600 16px "Arial Unicode MS Bold"', 'ع');
    await document.fonts.load('600 16px "Noto Sans Devanagari"', 'द');
    window.maplibregl = maplibregl;
</script>
</body>
</html>
