<!DOCTYPE html>
<html lang="en">
<head>
<title>Render a 3D Tiles quantized-mesh terrain POC</title>
<meta property="og:description" content="Decode a real 3D Tiles quantized-mesh terrain tile and render it as terrain-shaped geometry in a custom layer." />
<meta property="og:category" content="Terrain & Hillshade" />
<meta property="og:created" content="2026-07-15" />
<meta charset='utf-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel='stylesheet' href='../../dist/maplibre-gl.css' />
<link rel='icon' href='data:,' />
<style>
    body { margin: 0; padding: 0; }
    html, body, #map { height: 100%; }
</style>
</head>
<body>
<div id="map"></div>

<script type="module">
import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';
import decode from 'https://unpkg.com/@here/quantized-mesh-decoder@1.2.8/src/index.js';

// Proof of concept for https://github.com/maplibre/maplibre-gl-js/issues/4493:
// decode one real Cesium World Terrain quantized-mesh tile (Mont Blanc massif,
// bundled as a static asset) and render it through the custom-layer API.
// Decoding is done by the open-source @here/quantized-mesh-decoder package.
const TILE = {z: 9, x: 531, y: 386};
const TILE_URL = `../../docs/assets/examples/mont-blanc-terrain-tiles/${TILE.z}-${TILE.x}-${TILE.y}.terrain`;
const HEIGHT_EXAGGERATION = 1.2;

// The tileset uses the EPSG:4326 TMS scheme: 2 tiles wide at zoom 0,
// y growing northward.
function tileBounds(z, x, y) {
    const lonWidth = 360 / (2 * (2 ** z));
    const latHeight = 180 / (2 ** z);
    const west = -180 + x * lonWidth;
    const south = -90 + y * latHeight;
    return {west, south, east: west + lonWidth, north: south + latHeight};
}

const bounds = tileBounds(TILE.z, TILE.x, TILE.y);
const center = [(bounds.west + bounds.east) / 2, (bounds.south + bounds.north) / 2];

// Vertices are stored as small float32 offsets from a full-precision origin
// computed on the CPU, to avoid float32 precision loss at terrain scale
// (same technique as the "avoid jitter in a custom layer" example, #4871).
const originMercator = maplibregl.MercatorCoordinate.fromLngLat(center, 0);

function buildGeometry(decoded) {
    const {header, vertexData} = decoded;
    const vertexCount = vertexData.length / 3;
    const heightRange = header.maxHeight - header.minHeight || 1;
    const offsets = new Float32Array(vertexCount * 3);
    const normalizedHeights = new Float32Array(vertexCount);
    for (let i = 0; i < vertexCount; i++) {
        const u = vertexData[i];
        const v = vertexData[i + vertexCount];
        const height = vertexData[i + vertexCount * 2];
        const lng = bounds.west + (u / 32767) * (bounds.east - bounds.west);
        const lat = bounds.south + (v / 32767) * (bounds.north - bounds.south);
        const elevation = header.minHeight + (height / 32767) * heightRange;
        const mercator = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], elevation * HEIGHT_EXAGGERATION);
        offsets[i * 3 + 0] = mercator.x - originMercator.x;
        offsets[i * 3 + 1] = mercator.y - originMercator.y;
        offsets[i * 3 + 2] = mercator.z - originMercator.z;
        normalizedHeights[i] = height / 32767;
    }
    return {offsets, normalizedHeights};
}

const vertexSource = `#version 300 es
uniform mat4 u_matrix;
uniform vec4 u_originClip;
in vec3 a_offset;
in float a_normalizedHeight;
out float v_normalizedHeight;
void main() {
    v_normalizedHeight = a_normalizedHeight;
    gl_Position = u_originClip + u_matrix * vec4(a_offset, 0.0);
}`;

const fragmentSource = `#version 300 es
precision highp float;
in float v_normalizedHeight;
out vec4 fragColor;
void main() {
    vec3 low = vec3(0.40, 0.50, 0.32);
    vec3 high = vec3(0.95, 0.95, 0.97);
    fragColor = vec4(mix(low, high, smoothstep(0.3, 0.85, v_normalizedHeight)), 1.0);
}`;

function createProgram(gl, vertexShaderSource, fragmentShaderSource) {
    const program = gl.createProgram();
    for (const [type, source] of [[gl.VERTEX_SHADER, vertexShaderSource], [gl.FRAGMENT_SHADER, fragmentShaderSource]]) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(shader));
        }
        gl.attachShader(program, shader);
    }
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
    }
    return program;
}

function transformMat4(vec, m) {
    const [x, y, z, w] = vec;
    return [
        m[0] * x + m[4] * y + m[8] * z + m[12] * w,
        m[1] * x + m[5] * y + m[9] * z + m[13] * w,
        m[2] * x + m[6] * y + m[10] * z + m[14] * w,
        m[3] * x + m[7] * y + m[11] * z + m[15] * w
    ];
}

const terrainTileLayer = {
    id: 'quantized-mesh-tile',
    type: 'custom',
    renderingMode: '3d',

    async onAdd(map, gl) {
        this.program = createProgram(gl, vertexSource, fragmentSource);

        const response = await fetch(TILE_URL);
        const decoded = decode(await response.arrayBuffer());
        const {offsets, normalizedHeights} = buildGeometry(decoded);

        this.offsetBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.offsetBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, offsets, gl.STATIC_DRAW);

        this.heightBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.heightBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, normalizedHeights, gl.STATIC_DRAW);

        this.indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(decoded.triangleIndices), gl.STATIC_DRAW);
        this.indexCount = decoded.triangleIndices.length;

        map.triggerRepaint();
    },

    render(gl, args) {
        if (!this.indexCount) return;

        gl.useProgram(this.program);

        const matrix = args.defaultProjectionData.mainMatrix;
        const originClip = transformMat4([originMercator.x, originMercator.y, originMercator.z, 1], matrix);
        gl.uniform4fv(gl.getUniformLocation(this.program, 'u_originClip'), new Float32Array(originClip));
        gl.uniformMatrix4fv(gl.getUniformLocation(this.program, 'u_matrix'), false, new Float32Array(matrix));

        const aOffset = gl.getAttribLocation(this.program, 'a_offset');
        const aNormalizedHeight = gl.getAttribLocation(this.program, 'a_normalizedHeight');
        gl.enable(gl.DEPTH_TEST);

        gl.bindBuffer(gl.ARRAY_BUFFER, this.offsetBuffer);
        gl.enableVertexAttribArray(aOffset);
        gl.vertexAttribPointer(aOffset, 3, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, this.heightBuffer);
        gl.enableVertexAttribArray(aNormalizedHeight);
        gl.vertexAttribPointer(aNormalizedHeight, 1, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
        gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    }
};

const map = new maplibregl.Map({
    container: 'map',
    style: {version: 8, sources: {}, layers: [{id: 'sky', type: 'background', paint: {'background-color': '#bfe0f5'}}]},
    center,
    zoom: 9.8,
    pitch: 70,
    maxPitch: 85,
    bearing: 20,
    canvasContextAttributes: {antialias: true},
    customAttribution: 'Terrain: Cesium World Terrain via Cesium ion'
});

map.on('load', () => {
    map.addLayer(terrainTileLayer);
});
</script>
</body>
</html>
