<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fill rounded corners</title>
    <meta property="og:description" content="Use fill-rounded-corner-distance to round the corners of polygons in a fill layer." />
    <meta property="og:category" content="Layer Styling" />
    <meta property="og:created" content="2026-11-28" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #controls {
            font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background-color: rgba(50, 50, 50, 0.85);
            padding: 12px 16px;
            border-radius: 6px;
            box-sizing: border-box;
            min-width: min(280px, 100%);
            max-width: calc(100% - 20px);
        }
        #controls table { border-collapse: collapse; width: 100%; }
        #controls td { padding: 4px 6px; vertical-align: middle; }
        #controls td:nth-child(2) { width: 120px; }
        #controls td:last-child { text-align: right; width: 3em; }
        #controls label { white-space: nowrap; }
        #controls input[type=range] { width: 100%; min-width: 0; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="controls">
    <table>
        <tr>
            <td><label for="corner-distance">Corner distance (m)</label></td>
            <td><input type="range" id="corner-distance" min="0" max="20" step="0.5" value="4" /></td>
            <td><span>4</span></td>
        </tr>
        <tr>
            <td><label for="fill-opacity">Opacity</label></td>
            <td><input type="range" id="fill-opacity" min="0" max="100" step="5" value="100" /></td>
            <td><span>100</span>%</td>
        </tr>
        <tr>
            <td><label for="outline-color">Outline color</label></td>
            <td><input type="checkbox" id="outline-color" /></td>
            <td></td>
        </tr>
        <tr>
            <td><label for="globe">Globe</label></td>
            <td><input type="checkbox" id="globe" /></td>
            <td></td>
        </tr>
    </table>
</div>
<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        style: 'https://tiles.openfreemap.org/styles/bright',
        center: [-74.0049, 40.7148],
        zoom: 17,
        container: 'map'
    });

    map.on('load', () => {
        const buildingLayerIds = map.getStyle().layers
            .filter(l => l.type === 'fill' && l['source-layer'] === 'building')
            .map(l => l.id);

        function setBuildingPaint(name, value) {
            for (const id of buildingLayerIds) map.setPaintProperty(id, name, value);
        }

        setBuildingPaint('fill-color', '#6f8fd8');
        setBuildingPaint('fill-rounded-corner-distance', 4);

        document.getElementById('corner-distance').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            e.target.closest('tr').querySelector('span').textContent = val;
            setBuildingPaint('fill-rounded-corner-distance', val);
        });
        document.getElementById('fill-opacity').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            e.target.closest('tr').querySelector('span').textContent = val;
            setBuildingPaint('fill-opacity', val / 100);
        });
        document.getElementById('outline-color').addEventListener('change', (e) => {
            setBuildingPaint('fill-outline-color', e.target.checked ? '#d23c2a' : null);
        });
        document.getElementById('globe').addEventListener('change', (e) => {
            map.setProjection({type: e.target.checked ? 'globe' : 'mercator'});
        });
    });
</script>
</body>
</html>
