<!DOCTYPE html>
<html lang="en">
<head>
    <title>Query elevations from a DEM source</title>
    <meta property="og:description" content="Read the elevation under the pointer from the raster DEM tiles the source has already loaded, with queryElevations, and without turning terrain on." />
    <meta property="og:category" content="Terrain & Hillshade" />
    <meta property="og:created" content="2026-09-05" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css'>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #info {
            display: block;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translate(-50%);
            width: min(760px, calc(100% - 40px));
            padding: 10px;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.4;
            color: #222;
            background: rgb(255 255 255 / 92%);
            box-shadow: 0 2px 10px rgb(0 0 0 / 15%);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div id="map"></div>
<pre id="info">Move the pointer over the map to read the elevation.</pre>
<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                osm: {
                    type: 'raster',
                    tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                    tileSize: 256,
                    attribution: '&copy; OpenStreetMap contributors'
                },
                dem: {
                    type: 'raster-dem',
                    tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
                    tileSize: 512,
                    maxzoom: 15,
                    encoding: 'terrarium'
                }
            },
            layers: [
                {
                    id: 'osm',
                    type: 'raster',
                    source: 'osm'
                },
                {
                    id: 'hillshade',
                    type: 'hillshade',
                    source: 'dem',
                    paint: {
                        'hillshade-exaggeration': 0.35
                    }
                }
            ]
        },
        center: [7.3, 46.6],
        zoom: 11
    });

    const info = document.getElementById('info');

    map.on('mousemove', (e) => {
        const demSource = map.getSource('dem');
        if (!demSource) return;

        const [result] = demSource.queryElevations([e.lngLat]);
        const lngLat = e.lngLat.wrap();

        const lines = [`lngLat: ${lngLat.lng.toFixed(6)}, ${lngLat.lat.toFixed(6)}`];

        if (result) {
            lines.push(`elevation (m): ${result.elevation.toFixed(2)}`);
            lines.push(`tile zoom used: ${result.tileZoom}`);
        } else {
            lines.push('elevation: unavailable (no loaded DEM tile at this location yet)');
        }

        info.textContent = lines.join('\n');
    });
</script>
</body>
</html>
