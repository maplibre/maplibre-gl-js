<!DOCTYPE html>
<html lang="en">
<head>
    <title>Animate an icon on the GPU</title>
    <meta property="og:description" content="Draw an animated icon straight into the icon atlas with WebGL, without moving its pixels through the CPU." />
    <meta property="og:category" content="Icons & Symbols" />
    <meta property="og:created" content="2026-08-03" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json'
    });

    const size = 200;

    const vertexSource = `#version 300 es

    in vec2 a_pos;
    out vec2 v_pos;
    void main() {
        v_pos = a_pos;
        // the icon atlas holds its rows top to bottom and a framebuffer is read bottom to top,
        // so the y axis is flipped here to cancel out the copy below
        gl_Position = vec4(a_pos.x, -a_pos.y, 0.0, 1.0);
    }`;

    // draws the same pulsing dot as the "add an animated icon" example, in premultiplied alpha
    const fragmentSource = `#version 300 es

    precision highp float;
    uniform float u_time;
    in vec2 v_pos;
    out vec4 fragColor;
    void main() {
        float dist = length(v_pos);
        float aa = fwidth(dist);
        float outerRadius = 0.3 + 0.7 * u_time;
        float outerMask = 1.0 - smoothstep(outerRadius - aa, outerRadius + aa, dist);
        float innerMask = 1.0 - smoothstep(0.3 - aa, 0.3 + aa, dist);
        fragColor = mix(
            vec4(1.0, 0.78, 0.78, 1.0) * (1.0 - u_time) * outerMask,
            vec4(1.0, 0.39, 0.39, 1.0),
            innerMask);
    }`;

    // implementation of CustomStyleImageInterface, an icon that paints itself with WebGL
    // Search for CustomStyleImageInterface in https://maplibre.org/maplibre-gl-js/docs/API/
    const pulsingDot = {
        type: 'custom',
        width: size,
        height: size,

        onAdd ({invalidate}) {
            this.invalidate = invalidate;
        },

        // draws this icon's slot of the shared icon atlas
        render ({gl, texture, x, y, width, height}) {
            if (!this.program) this.setup(gl);

            // draw the dot into an offscreen texture of our own
            gl.bindFramebuffer(gl.FRAMEBUFFER, this.framebuffer);
            gl.viewport(0, 0, width, height);
            gl.disable(gl.BLEND);
            gl.disable(gl.DEPTH_TEST);
            gl.disable(gl.SCISSOR_TEST);
            gl.useProgram(this.program);
            gl.uniform1f(this.uTime, (performance.now() % 1000) / 1000);
            gl.bindVertexArray(this.vertexArray);
            gl.drawArrays(gl.TRIANGLES, 0, 3);

            // then copy it into this icon's slot. Copying rather than drawing into the atlas
            // directly means nothing here can touch another icon's pixels
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, x, y, 0, 0, width, height);

            // ask to be drawn again, which is what keeps the animation going. An icon that
            // changes less often would call this from a timer instead, letting the map idle
            this.invalidate();
        },

        setup (gl) {
            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vertexSource);
            gl.compileShader(vertexShader);

            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fragmentSource);
            gl.compileShader(fragmentShader);

            this.program = gl.createProgram();
            gl.attachShader(this.program, vertexShader);
            gl.attachShader(this.program, fragmentShader);
            gl.linkProgram(this.program);
            this.uTime = gl.getUniformLocation(this.program, 'u_time');

            this.offscreenTexture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, this.offscreenTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, this.width, this.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
            this.framebuffer = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, this.framebuffer);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.offscreenTexture, 0);

            // one triangle covering the whole viewport, in its own vertex array so that this
            // example cannot disturb the attributes MapLibre has set up
            this.buffer = gl.createBuffer();
            this.vertexArray = gl.createVertexArray();
            gl.bindVertexArray(this.vertexArray);
            gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            const aPos = gl.getAttribLocation(this.program, 'a_pos');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            this.gl = gl;
        },

        // also called when the WebGL context is lost, so everything above has to be
        // recreatable from scratch
        onRemove () {
            if (!this.program) return;
            this.gl.deleteProgram(this.program);
            this.gl.deleteFramebuffer(this.framebuffer);
            this.gl.deleteTexture(this.offscreenTexture);
            this.gl.deleteBuffer(this.buffer);
            this.gl.deleteVertexArray(this.vertexArray);
            this.program = undefined;
        }
    };

    map.on('load', () => {
        map.addImage('pulsing-dot', pulsingDot, {pixelRatio: 2});

        map.addSource('points', {
            'type': 'geojson',
            'data': {
                'type': 'FeatureCollection',
                'features': [
                    {
                        'type': 'Feature',
                        'geometry': {
                            'type': 'Point',
                            'coordinates': [0, 0]
                        }
                    }
                ]
            }
        });
        map.addLayer({
            'id': 'points',
            'type': 'symbol',
            'source': 'points',
            'layout': {
                'icon-image': 'pulsing-dot'
            }
        });
    });
</script>
</body>
</html>
