<!DOCTYPE html>
<html lang="en">
<head>
<title>Avoid jitter in a custom layer at high zoom</title>
<meta property="og:description" content="Render building-scale geometry in a custom layer without float32 precision jitter, using origin-relative rendering." />
<meta property="og:category" content="3D Models & Buildings" />
<meta property="og:created" content="2026-07-15" />
<meta charset='utf-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel='stylesheet' href='../../dist/maplibre-gl.css' />
<style>
    body { margin: 0; padding: 0; }
    html, body, #map { height: 100%; }
    #toggle {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        font: 14px/1.4 system-ui, sans-serif;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
    }
</style>
</head>
<body>
<div id="map"></div>
<button id="toggle" type="button">Switch to naive projection (jittery)</button>

<script type="module">
import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

// Custom-layer vertices are in mercator units (~0.5 in magnitude), where
// float32 keeps only metre-scale precision, so room-scale geometry jitters
// (#4871). Fix: store vertices as small offsets from a fixed origin, push the
// origin through the 64-bit projection matrix on the CPU, and add the two in
// the shader. Toggle to compare against the naive absolute-coordinate path.

const FISHER_BUILDING = [-87.629003, 41.877218];
const FLOOR_HEIGHT_M = 4;
const ROOMS = [
    {x: [-9, -1], y: [-7, -1], color: [0.85, 0.55, 0.35]},
    {x: [1, 9], y: [-7, -1], color: [0.35, 0.65, 0.85]},
    {x: [-9, -1], y: [1, 7], color: [0.55, 0.80, 0.45]},
    {x: [1, 9], y: [1, 7], color: [0.80, 0.45, 0.75]}
];

const originMercator = maplibregl.MercatorCoordinate.fromLngLat(FISHER_BUILDING, 0);
const metersToMercatorUnits = originMercator.meterInMercatorCoordinateUnits();

function buildOffsetsAndColors() {
    const offsets = [];
    const colors = [];
    for (let floor = 0; floor < 3; floor++) {
        const dz = floor * FLOOR_HEIGHT_M * metersToMercatorUnits;
        for (const room of ROOMS) {
            const x0 = room.x[0] * metersToMercatorUnits;
            const x1 = room.x[1] * metersToMercatorUnits;
            const y0 = -room.y[0] * metersToMercatorUnits;
            const y1 = -room.y[1] * metersToMercatorUnits;
            const corners = [
                [x0, y0, dz], [x1, y0, dz], [x1, y1, dz],
                [x1, y1, dz], [x0, y1, dz], [x0, y0, dz]
            ];
            for (const c of corners) {
                offsets.push(c[0], c[1], c[2]);
                colors.push(room.color[0], room.color[1], room.color[2]);
            }
        }
    }
    return {offsets: new Float32Array(offsets), colors: new Float32Array(colors)};
}

const preciseVertexSource = `#version 300 es
uniform mat4 u_matrix;
uniform vec4 u_originClip;
in vec3 a_offset;
in vec3 a_color;
out vec3 v_color;
void main() {
    v_color = a_color;
    gl_Position = u_originClip + u_matrix * vec4(a_offset, 0.0);
}`;

const naiveVertexSource = `#version 300 es
uniform mat4 u_matrix;
uniform vec3 u_originF32;
in vec3 a_offset;
in vec3 a_color;
out vec3 v_color;
void main() {
    v_color = a_color;
    gl_Position = u_matrix * vec4(u_originF32 + a_offset, 1.0);
}`;

const fragmentSource = `#version 300 es
precision highp float;
in vec3 v_color;
out vec4 fragColor;
void main() {
    fragColor = vec4(v_color, 1.0);
}`;

function compileProgram(gl, vertexSource) {
    const program = gl.createProgram();
    for (const [type, source] of [[gl.VERTEX_SHADER, vertexSource], [gl.FRAGMENT_SHADER, fragmentSource]]) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
        gl.attachShader(program, shader);
    }
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    return program;
}

function transformMat4(v, m) {
    const [x, y, z, w] = v;
    return [
        m[0] * x + m[4] * y + m[8] * z + m[12] * w,
        m[1] * x + m[5] * y + m[9] * z + m[13] * w,
        m[2] * x + m[6] * y + m[10] * z + m[14] * w,
        m[3] * x + m[7] * y + m[11] * z + m[15] * w
    ];
}

const buildingLayer = {
    id: 'building-floors',
    type: 'custom',
    renderingMode: '3d',
    useNaiveProjection: false,

    onAdd(map, gl) {
        this.preciseProgram = compileProgram(gl, preciseVertexSource);
        this.naiveProgram = compileProgram(gl, naiveVertexSource);

        const {offsets, colors} = buildOffsetsAndColors();
        this.vertexCount = offsets.length / 3;
        this.offsetBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.offsetBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, offsets, gl.STATIC_DRAW);
        this.colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    },

    render(gl, args) {
        const program = this.useNaiveProjection ? this.naiveProgram : this.preciseProgram;
        gl.useProgram(program);
        const matrix = args.defaultProjectionData.mainMatrix;

        if (this.useNaiveProjection) {
            gl.uniform3fv(gl.getUniformLocation(program, 'u_originF32'),
                new Float32Array([originMercator.x, originMercator.y, originMercator.z]));
        } else {
            const originClip = transformMat4([originMercator.x, originMercator.y, originMercator.z, 1], matrix);
            gl.uniform4fv(gl.getUniformLocation(program, 'u_originClip'), new Float32Array(originClip));
        }
        gl.uniformMatrix4fv(gl.getUniformLocation(program, 'u_matrix'), false, new Float32Array(matrix));

        const aOffset = gl.getAttribLocation(program, 'a_offset');
        gl.bindBuffer(gl.ARRAY_BUFFER, this.offsetBuffer);
        gl.enableVertexAttribArray(aOffset);
        gl.vertexAttribPointer(aOffset, 3, gl.FLOAT, false, 0, 0);
        const aColor = gl.getAttribLocation(program, 'a_color');
        gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
        gl.enableVertexAttribArray(aColor);
        gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);

        gl.enable(gl.DEPTH_TEST);
        gl.drawArrays(gl.TRIANGLES, 0, this.vertexCount);
    }
};

const map = new maplibregl.Map({
    container: 'map',
    style: {version: 8, sources: {}, layers: [{id: 'sky', type: 'background', paint: {'background-color': '#bfe6f2'}}]},
    center: FISHER_BUILDING,
    zoom: 20,
    pitch: 70,
    bearing: -30,
    canvasContextAttributes: {antialias: true}
});

map.on('load', () => map.addLayer(buildingLayer));

const toggle = document.getElementById('toggle');
toggle.addEventListener('click', () => {
    buildingLayer.useNaiveProjection = !buildingLayer.useNaiveProjection;
    toggle.textContent = buildingLayer.useNaiveProjection
        ? 'Switch to origin-relative projection (fixed)'
        : 'Switch to naive projection (jittery)';
    map.triggerRepaint();
});
</script>
</body>
</html>
