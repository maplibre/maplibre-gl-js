<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pan a globe with a free bearing</title>
    <meta property="og:description" content="Toggle DragPanOptions.fixedBearing to let the globe rotate under the cursor while dragging near the poles." />
    <meta property="og:created" content="2026-07-12" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }

        .fixed-bearing-toggle {
            font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            background: #fff;
            padding: 10px;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
<div id="map"></div>
<label class="fixed-bearing-toggle">
    <input type="checkbox" id="fixedBearing" checked="checked" />
    Fixed bearing while panning
</label>
<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        zoom: 1,
        center: [0, 80],
    });

    map.on('style.load', () => {
        map.setProjection({
            type: 'globe', // Set projection to globe
        });
    });

    document.getElementById('fixedBearing').addEventListener('change', (e) => {
        // Panning always rotates the globe with a quaternion, which stays smooth
        // near and across the poles. fixedBearing only decides what happens to the
        // bearing: keep it fixed (the default), or let it drift during the drag so
        // that the grabbed location tracks the cursor exactly.
        map.dragPan.enable({fixedBearing: e.target.checked});
    });
</script>
</body>
</html>
