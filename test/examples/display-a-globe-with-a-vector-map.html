<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display a globe with a vector map</title>
    <meta property="og:description" content="Display a globe with a vector map." />
    <meta property="og:category" content="Globe" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }

        .fixed-bearing-toggle {
            font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            background: #fff;
            padding: 10px;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
<div id="map"></div>
<label class="fixed-bearing-toggle">
    <input type="checkbox" id="fixedBearing" checked>
    Fixed bearing while panning
</label>
<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        zoom: 2,
        center: [0, 0],
    });

    map.on('style.load', () => {
        map.setProjection({
            type: 'globe', // Set projection to globe
        });
    });

    document.getElementById('fixedBearing').addEventListener('change', (e) => {
        // Keep the bearing fixed while panning (the default), or let it drift
        // during the drag so the grabbed location tracks the cursor exactly.
        map.dragPan.enable({fixedBearing: e.target.checked});
    });
</script>
</body>
</html>
